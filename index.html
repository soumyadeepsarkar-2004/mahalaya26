<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahalaya '26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500&family=Space+Mono:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-white overflow-hidden bg-black selection:bg-white/30 font-sans antialiased custom-cursor">
    
    <!-- Custom Cursor -->
    <div id="cursor-dot" class="hidden md:block fixed top-0 left-0 w-2 h-2 bg-white rounded-full pointer-events-none z-50 transform -translate-x-1/2 -translate-y-1/2 transition-transform duration-100 ease-out mix-blend-difference"></div>
    <div id="cursor-outline" class="hidden md:block fixed top-0 left-0 w-8 h-8 border border-white/30 rounded-full pointer-events-none z-50 transform -translate-x-1/2 -translate-y-1/2 transition-all duration-300 ease-out"></div>

    <!-- Scene Background with Parallax Wrapper -->
    <div id="parallax-wrapper" class="absolute inset-0 w-full h-full transform will-change-transform">
        <div id="bg-1" class="scene-bg bg-cover bg-center absolute inset-0 z-0 scale-[1.05]"></div>
        <div id="bg-2" class="scene-bg bg-cover bg-center absolute inset-0 z-0 scale-[1.05]" style="opacity: 0;"></div>
        
        <div id="grain-overlay" class="absolute inset-0 z-0 pointer-events-none opacity-[0.12] mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
        <canvas id="particles-canvas" class="absolute inset-0 z-0 opacity-40 pointer-events-none"></canvas>
    </div>
    
    <div class="absolute inset-0 z-0 pointer-events-none bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-transparent to-black/40"></div>
    <div class="absolute bottom-0 w-full h-1/2 z-0 pointer-events-none bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>

    <!-- UI Layer -->
    <div id="ui-layer" class="relative z-10 w-full h-screen flex flex-col justify-between p-6 md:p-10 pb-8 md:pb-12 max-w-[1920px] mx-auto pointer-events-none transform will-change-transform">
        
        <!-- Top Row -->
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-2">
                <div class="glass-micro px-6 py-2.5 rounded-full flex items-center gap-2 shadow-sm">
                    <span class="text-[10px] md:text-[11px] tracking-[0.3em] font-medium text-white/95 uppercase">Mahalaya '26</span>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <div class="hidden md:flex flex-col text-right">
                    <div class="flex items-center gap-2 justify-end">
                        <i class="fas fa-sun text-white/40 text-[10px]"></i>
                        <span id="current-time" class="text-xs tracking-widest text-white/90 uppercase font-serif">--:-- --</span>
                    </div>
                    <span class="text-[8px] tracking-[0.3em] font-mono text-white/50 uppercase mt-1">Kolkata</span>
                </div>
                <div class="hidden md:block w-px h-6 bg-white/10"></div>
                <div class="flex flex-col text-right">
                    <div class="flex items-center gap-2 justify-end">
                        <i class="fas fa-hourglass-half text-white/40 text-[9px]"></i>
                        <span id="cd-val" class="text-xs tracking-widest text-white/90 uppercase font-serif">-- DAYS</span>
                    </div>
                    <span id="cd-label" class="text-[8px] tracking-[0.3em] font-mono text-white/50 uppercase mt-1">UNTIL MAHALAYA</span>
                </div>
            </div>
        </div>

        <div class="absolute right-12 top-32 opacity-60 hidden xl:block pointer-events-none transform rotate-[-5deg]">
            <p class="font-serif italic text-3xl text-white/70">Asche<br>Bochor<br>Abar Hobe <i class="far fa-heart text-sm ml-2"></i></p>
        </div>
        <div class="absolute left-10 bottom-40 opacity-60 hidden xl:block pointer-events-none transform rotate-[-3deg]">
            <p class="font-serif italic text-xl text-white/50">Same<br>Skies<br>Same<br>Feelings<br>Different<br>Year <i class="far fa-heart text-xs ml-1"></i></p>
        </div>

        <!-- Middle Left: Chapter Info -->
        <div class="static md:absolute md:left-10 md:top-1/2 md:transform md:-translate-y-1/2 flex flex-col gap-1 pointer-events-auto max-w-full md:max-w-[400px] z-20 mt-auto md:mt-0 mb-6 md:mb-0">
            <div class="flex items-center gap-3 text-white/50 mb-1 md:mb-3">
                <div class="w-6 h-px bg-white/30"></div>
                <span class="text-[8px] tracking-[0.4em] font-mono uppercase" id="chapter-indicator">CHAPTER -- / 09</span>
            </div>
            
            <div class="relative overflow-hidden h-[50px] md:h-[90px]">
                <h2 id="fp-title" class="text-5xl md:text-7xl lg:text-8xl font-serif font-semibold text-white/95 tracking-wide drop-shadow-xl absolute top-0 left-0 transition-all duration-700 ease-out">...</h2>
                <h2 id="fp-title-next" class="text-5xl md:text-7xl lg:text-8xl font-serif font-semibold text-white/95 tracking-wide drop-shadow-xl absolute top-[100%] left-0 opacity-0 transition-all duration-700 ease-out">...</h2>
            </div>
            
            <div class="relative overflow-hidden h-[20px] md:h-[32px] mt-1">
                <p id="fp-subtitle" class="text-base md:text-2xl font-serif text-white/80 italic absolute top-0 left-0 transition-all duration-700 ease-out">...</p>
                <p id="fp-subtitle-next" class="text-base md:text-2xl font-serif text-white/80 italic absolute top-[100%] left-0 opacity-0 transition-all duration-700 ease-out">...</p>
            </div>
            
            <div class="relative overflow-hidden h-[30px] md:h-[60px] mt-2 md:mt-4 hidden md:block">
                <p id="fp-desc" class="text-[10px] md:text-xs text-white/60 font-sans tracking-[0.05em] leading-relaxed absolute top-0 left-0 transition-all duration-700 ease-out w-full pr-4">...</p>
                <p id="fp-desc-next" class="text-[10px] md:text-xs text-white/60 font-sans tracking-[0.05em] leading-relaxed absolute top-[100%] left-0 opacity-0 transition-all duration-700 ease-out w-full pr-4"></p>
            </div>
        </div>

        <!-- Bottom Row -->
        <div class="flex flex-col xl:flex-row justify-between items-end gap-6 w-full pointer-events-auto relative z-30">
            
            <!-- Bottom Left: Radio Controller -->
            <div class="glass-primary p-3 md:p-4 rounded-[20px] md:rounded-[24px] w-full md:w-[320px] flex gap-3 md:gap-4 items-center shrink-0 group shadow-2xl relative overflow-hidden">
                <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/10 to-transparent w-full h-full transform animate-glass-shine pointer-events-none z-0"></div>
                
                <div class="w-12 h-12 md:w-14 md:h-14 rounded-[12px] md:rounded-[14px] bg-cover bg-center shadow-inner relative overflow-hidden shrink-0 z-10 border border-white/10 transition-all duration-500" id="radio-thumb">
                    <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors duration-500"></div>
                </div>
                
                <div class="flex-1 flex flex-col gap-2 md:gap-3 min-w-0 z-10">
                    <div class="flex justify-between items-start">
                        <div class="flex flex-col min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="font-serif text-sm md:text-base text-white/95 leading-none">Puja Radio</span>
                                <div class="w-1.5 h-1.5 rounded-full bg-red-500/80 shadow-[0_0_8px_rgba(239,68,68,0.6)] opacity-50 transition-opacity duration-300" id="on-air-indicator"></div>
                                <span class="text-[6px] md:text-[7px] text-red-400/80 tracking-[0.2em] font-bold">ON AIR</span>
                            </div>
                            <span id="player-track" class="text-[9px] md:text-[10px] tracking-wide text-white/60 mt-1 truncate max-w-[140px]">...</span>
                        </div>
                        
                        <div class="flex items-end gap-[2px] h-3 opacity-0 transition-opacity duration-500 mt-0.5 shrink-0" id="audio-eq">
                            <div class="w-[1.5px] bg-white/80 rounded-t h-[30%] eq-bar eq-1"></div>
                            <div class="w-[1.5px] bg-white/80 rounded-t h-[70%] eq-bar eq-2"></div>
                            <div class="w-[1.5px] bg-white/80 rounded-t h-[50%] eq-bar eq-3"></div>
                            <div class="w-[1.5px] bg-white/80 rounded-t h-[90%] eq-bar eq-4"></div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3 md:gap-4">
                        <button id="btn-prev" class="outline-none text-[9px] md:text-[10px] text-white/50 hover:text-white transition-colors magnetic-sm"><i class="fas fa-step-backward"></i></button>
                        <button id="btn-play-pause-small" class="w-6 h-6 flex items-center justify-center outline-none magnetic-sm border border-transparent hover:border-white/20 rounded-full transition-all">
                            <i class="fas fa-play text-[10px] md:text-xs text-white" id="play-icon-small"></i>
                        </button>
                        <button id="btn-next" class="outline-none text-[9px] md:text-[10px] text-white/50 hover:text-white transition-colors magnetic-sm"><i class="fas fa-step-forward"></i></button>
                        
                        <!-- Volume: Always show thumb on mobile via touch-friendly class -->
                        <div class="flex items-center gap-2 ml-auto w-16 md:w-20 group/vol relative cursor-pointer">
                            <i class="fas fa-volume-up text-[8px] md:text-[9px] text-white/40 group-hover/vol:text-white/80 transition-colors"></i>
                            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full h-[1.5px] bg-white/10 rounded-full appearance-none slider-thumb-mini absolute left-4 opacity-100 md:opacity-0 group-hover/vol:opacity-100 transition-opacity duration-300 touch-volume">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Center: Liquid Timeline with Thumbnails -->
            <div class="relative w-full max-w-full xl:max-w-[700px] 2xl:max-w-[850px] flex items-center justify-center overflow-visible xl:absolute xl:left-1/2 xl:bottom-0 xl:transform xl:-translate-x-1/2 pointer-events-none">
                
                <button class="absolute -left-10 w-7 h-7 rounded-full border border-white/10 flex items-center justify-center text-white/40 hover:text-white hover:bg-white/5 transition-all hidden md:flex magnetic pointer-events-auto" id="timeline-prev">
                    <i class="fas fa-chevron-left text-[8px]"></i>
                </button>

                <div class="flex gap-2 md:gap-3 overflow-x-auto no-scrollbar snap-x snap-mandatory py-2 px-1 w-full pointer-events-auto mask-edges-timeline" id="timeline-container">
                    <!-- Javascript injects timeline cards here -->
                </div>

                <button class="absolute -right-10 w-7 h-7 rounded-full border border-white/10 flex items-center justify-center text-white/40 hover:text-white hover:bg-white/5 transition-all hidden md:flex magnetic pointer-events-auto" id="timeline-next">
                    <i class="fas fa-chevron-right text-[8px]"></i>
                </button>
            </div>
            
            <div class="hidden xl:flex items-end flex-col gap-4 shrink-0 pointer-events-none opacity-0">
                <!-- Spacing block to keep layout balanced -->
                <div class="w-32 h-10"></div>
            </div>
            
        </div>
    </div>
    
    <audio id="audio-player"></audio>
    <script src="script.js"></script>
</body>
</html>
