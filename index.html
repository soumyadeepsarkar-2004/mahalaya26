<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahalaya & Durga Puja Lo-Fi Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-white overflow-hidden font-sans">
    <div id="background-container" class="absolute inset-0 bg-cover bg-center -z-10 transition-all duration-1000 ease-in-out" style="background-image: url('bg_mahalaya.jpg');"></div>
    <div class="absolute inset-0 bg-black/40 -z-10"></div> <!-- Dark Overlay -->

    <!-- Mobile Menu Button -->
    <button id="mobile-menu-btn" class="md:hidden absolute top-4 left-4 z-50 p-2 text-2xl text-white drop-shadow-md">
        <i class="fas fa-bars"></i>
    </button>

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:relative inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out w-72 md:w-80 glass-panel border-r border-white/20 z-40 flex flex-col">
            <div class="p-6 border-b border-white/20">
                <h1 class="text-2xl font-bold text-orange-200 tracking-wider">Durga Puja Radio</h1>
                <p class="text-sm text-gray-300 mt-1">Nostalgic Lo-Fi Beats</p>
            </div>
            
            <div class="flex text-sm font-medium border-b border-white/20">
                <button id="tab-radio" class="flex-1 py-3 text-orange-200 border-b-2 border-orange-200">Live Radio</button>
                <button id="tab-playlists" class="flex-1 py-3 text-gray-400 hover:text-white transition">Playlists</button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
                <!-- Radio Content -->
                <div id="content-radio" class="space-y-3">
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group radio-station flex items-center gap-3">
                        <div class="w-10 h-10 rounded bg-orange-900/50 flex items-center justify-center group-hover:bg-orange-500 transition">
                            <i class="fas fa-broadcast-tower text-orange-200"></i>
                        </div>
                        <div>
                            <p class="font-semibold text-white">Akashvani Kolkata</p>
                            <p class="text-xs text-gray-400">Classic AM Broadcast</p>
                        </div>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group radio-station flex items-center gap-3">
                        <div class="w-10 h-10 rounded bg-orange-900/50 flex items-center justify-center group-hover:bg-orange-500 transition">
                            <i class="fas fa-satellite-dish text-orange-200"></i>
                        </div>
                        <div>
                            <p class="font-semibold text-white">Retro Puja Radio</p>
                            <p class="text-xs text-gray-400">Vintage Festive Tunes</p>
                        </div>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group radio-station flex items-center gap-3">
                        <div class="w-10 h-10 rounded bg-orange-900/50 flex items-center justify-center group-hover:bg-orange-500 transition">
                            <i class="fas fa-headphones text-orange-200"></i>
                        </div>
                        <div>
                            <p class="font-semibold text-white">Lofi Durga Puja</p>
                            <p class="text-xs text-gray-400">Chill Beats</p>
                        </div>
                    </button>
                </div>

                <!-- Playlists Content -->
                <div id="content-playlists" class="hidden space-y-3">
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group playlist-item" data-playlist="mahalaya">
                        <p class="font-semibold text-orange-200">Mahalaya</p>
                        <p class="text-xs text-gray-400">Dawn chants & nostalgic tracks</p>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group playlist-item" data-playlist="pre-puja">
                        <p class="font-semibold text-white group-hover:text-orange-200">Pre-Puja</p>
                        <p class="text-xs text-gray-400">Prathama to Panchami</p>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group playlist-item" data-playlist="shashthi">
                        <p class="font-semibold text-white group-hover:text-orange-200">Shashthi</p>
                        <p class="text-xs text-gray-400">Bodhon specials</p>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group playlist-item" data-playlist="saptami">
                        <p class="font-semibold text-white group-hover:text-orange-200">Saptami</p>
                        <p class="text-xs text-gray-400">Morning Anjali tracks</p>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group playlist-item" data-playlist="ashtami">
                        <p class="font-semibold text-white group-hover:text-orange-200">Ashtami</p>
                        <p class="text-xs text-gray-400">Sandhi Puja & Dhak</p>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group playlist-item" data-playlist="navami">
                        <p class="font-semibold text-white group-hover:text-orange-200">Navami</p>
                        <p class="text-xs text-gray-400">Evening celebrations</p>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group playlist-item" data-playlist="dashami">
                        <p class="font-semibold text-white group-hover:text-orange-200">Dashami</p>
                        <p class="text-xs text-gray-400">Bisarjan farewells</p>
                    </button>
                    <button class="w-full text-left p-3 rounded-lg hover:bg-white/10 transition group playlist-item" data-playlist="ekadashi">
                        <p class="font-semibold text-white group-hover:text-orange-200">Ekadashi</p>
                        <p class="text-xs text-gray-400">Asche bochhor abar hobe</p>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col relative h-full">
            <!-- Countdown Timer -->
            <div id="countdown-container" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center glass-panel p-8 md:p-12 rounded-3xl transition-opacity duration-1000 z-10 w-11/12 max-w-2xl text-center shadow-2xl border border-white/20">
                <h2 class="text-2xl md:text-4xl font-bold mb-8 text-orange-100 tracking-widest uppercase drop-shadow-md">Awakening of the Goddess</h2>
                <div class="flex gap-4 md:gap-8 justify-center w-full">
                    <div class="flex flex-col items-center">
                        <div class="text-4xl md:text-7xl font-bold text-white drop-shadow-[0_0_15px_rgba(255,165,0,0.5)]" id="days">00</div>
                        <div class="text-xs md:text-sm text-orange-200 mt-2 tracking-widest uppercase">Days</div>
                    </div>
                    <div class="text-3xl md:text-6xl font-bold text-white/50">:</div>
                    <div class="flex flex-col items-center">
                        <div class="text-4xl md:text-7xl font-bold text-white drop-shadow-[0_0_15px_rgba(255,165,0,0.5)]" id="hours">00</div>
                        <div class="text-xs md:text-sm text-orange-200 mt-2 tracking-widest uppercase">Hrs</div>
                    </div>
                    <div class="text-3xl md:text-6xl font-bold text-white/50">:</div>
                    <div class="flex flex-col items-center">
                        <div class="text-4xl md:text-7xl font-bold text-white drop-shadow-[0_0_15px_rgba(255,165,0,0.5)]" id="minutes">00</div>
                        <div class="text-xs md:text-sm text-orange-200 mt-2 tracking-widest uppercase">Min</div>
                    </div>
                    <div class="text-3xl md:text-6xl font-bold text-white/50">:</div>
                    <div class="flex flex-col items-center">
                        <div class="text-4xl md:text-7xl font-bold text-white drop-shadow-[0_0_15px_rgba(255,165,0,0.5)]" id="seconds">00</div>
                        <div class="text-xs md:text-sm text-orange-200 mt-2 tracking-widest uppercase">Sec</div>
                    </div>
                </div>
            </div>

            <!-- Live Mahalaya Broadcast Message (Hidden initially) -->
            <div id="live-broadcast" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center glass-panel p-8 md:p-12 rounded-3xl z-10 w-11/12 max-w-2xl text-center">
                <h2 class="text-3xl md:text-5xl font-bold mb-4 text-orange-300 drop-shadow-md">Shubho Mahalaya</h2>
                <p class="text-lg text-white/80 mb-6">Live Broadcast is on.</p>
                <!-- Equalizer for center -->
                <div class="flex gap-1 h-12 items-end justify-center">
                    <div class="w-2 bg-orange-400 rounded-t eq-bar eq-1"></div>
                    <div class="w-2 bg-orange-300 rounded-t eq-bar eq-2"></div>
                    <div class="w-2 bg-orange-400 rounded-t eq-bar eq-3"></div>
                    <div class="w-2 bg-orange-200 rounded-t eq-bar eq-4"></div>
                    <div class="w-2 bg-orange-400 rounded-t eq-bar eq-5"></div>
                </div>
            </div>

            <!-- Spacer -->
            <div class="flex-1"></div>

            <!-- Player Bottom Bar -->
            <div class="glass-panel border-t border-white/20 p-4 w-full relative z-20">
                <div class="max-w-screen-xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                    
                    <!-- Track Info -->
                    <div class="flex items-center gap-4 w-full md:w-1/3">
                        <div class="w-12 h-12 rounded-lg bg-orange-900/60 border border-white/20 flex items-center justify-center shrink-0">
                            <i class="fas fa-music text-orange-300 text-xl"></i>
                        </div>
                        <div class="overflow-hidden">
                            <h3 id="current-track-name" class="font-bold text-white truncate text-sm md:text-base">Awaiting Dawn...</h3>
                            <p id="current-playlist-name" class="text-xs text-orange-200/80 truncate">Mahalaya Special</p>
                        </div>
                        
                        <!-- Small Equalizer (visible only when playing) -->
                        <div id="mini-eq" class="hidden gap-[2px] h-4 items-end ml-2">
                            <div class="w-1 bg-orange-400 rounded-t eq-bar eq-1"></div>
                            <div class="w-1 bg-orange-300 rounded-t eq-bar eq-2"></div>
                            <div class="w-1 bg-orange-400 rounded-t eq-bar eq-3"></div>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="flex flex-col items-center w-full md:w-1/3">
                        <div class="flex items-center gap-6 mb-2">
                            <button id="btn-prev" class="text-white/70 hover:text-white transition"><i class="fas fa-step-backward text-lg"></i></button>
                            <button id="btn-play-pause" class="w-12 h-12 flex items-center justify-center rounded-full bg-orange-600 hover:bg-orange-500 text-white transition shadow-lg shadow-orange-500/30">
                                <i class="fas fa-play ml-1" id="play-icon"></i>
                            </button>
                            <button id="btn-next" class="text-white/70 hover:text-white transition"><i class="fas fa-step-forward text-lg"></i></button>
                        </div>
                        <!-- Progress Bar -->
                        <div class="w-full flex items-center gap-3 text-xs text-white/60 font-mono">
                            <span id="time-current">0:00</span>
                            <div class="flex-1 h-1.5 bg-black/40 rounded-full cursor-pointer relative" id="progress-container">
                                <div id="progress-bar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-orange-600 to-yellow-400 rounded-full w-0"></div>
                            </div>
                            <span id="time-total">--:--</span>
                        </div>
                    </div>

                    <!-- Volume -->
                    <div class="hidden md:flex items-center justify-end gap-3 w-1/3">
                        <i class="fas fa-volume-up text-white/70 text-sm"></i>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-24 h-1.5 bg-black/40 rounded-lg appearance-none cursor-pointer accent-orange-500">
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Audio Element -->
    <audio id="audio-player"></audio>

    <script src="script.js"></script>
</body>
</html>
