<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahalaya '26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-white overflow-hidden bg-black selection:bg-white/30 font-sans antialiased">
    
    <!-- Background Scene (Dual for crossfading) -->
    <div id="bg-1" class="scene-bg bg-cover bg-center absolute inset-0 z-0 scale-[1.02] transform origin-center" style="background-image: url('assets/bg-mahalaya.png');"></div>
    <div id="bg-2" class="scene-bg bg-cover bg-center absolute inset-0 z-0 scale-[1.02] transform origin-center" style="opacity: 0;"></div>
    
    <!-- Subtle grain overlay -->
    <div class="absolute inset-0 z-0 pointer-events-none opacity-15 mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
    <!-- Very soft localized vignette -->
    <div class="absolute inset-0 z-0 pointer-events-none bg-gradient-to-t from-black/50 via-transparent to-black/20"></div>

    <div class="relative z-10 w-full h-screen flex flex-col justify-between p-4 md:p-8 pb-8 md:pb-10">
        
        <!-- Top Row -->
        <div class="flex justify-between items-start">
            <!-- Identity -->
            <div class="glass-micro px-4 py-2 rounded-full text-[10px] tracking-widest font-medium text-white/90 uppercase shadow-sm">
                Mahalaya '26
            </div>
            
            <!-- Countdown Capsule -->
            <div id="countdown-capsule" class="glass-micro px-4 py-2 rounded-full text-xs tracking-widest text-white/90 flex items-center gap-3">
                <span class="font-serif text-lg leading-none" id="cd-val">00</span>
                <span class="text-[9px] uppercase tracking-[0.2em] opacity-70 leading-tight" id="cd-label">Days<br>Until</span>
            </div>
        </div>

        <!-- Bottom Area -->
        <div class="flex flex-col lg:flex-row justify-between items-end gap-6 md:gap-8 w-full max-w-[1600px] mx-auto relative">
            
            <!-- Festival Panel (Bottom Left) -->
            <div class="glass-primary p-6 md:p-8 rounded-[24px] md:rounded-[32px] w-full lg:w-[400px] transform transition-all duration-700 ease-out" id="festival-panel">
                <h2 id="fp-title" class="text-4xl md:text-5xl lg:text-6xl font-serif font-bold text-white/95 mb-1 md:mb-2 tracking-wide drop-shadow-sm transition-opacity duration-500">MAHALAYA</h2>
                <p id="fp-subtitle" class="text-base md:text-lg font-serif text-white/80 italic mb-6 md:mb-8 transition-opacity duration-500">Dawn chants & anticipation</p>
                <div class="text-[9px] md:text-[10px] tracking-[0.2em] font-sans text-white/60 uppercase flex items-center gap-2 md:gap-3 opacity-80">
                    <span>Bengal</span> <span class="w-1 h-1 rounded-full bg-white/40"></span> <span>Durga Puja</span> <span class="w-1 h-1 rounded-full bg-white/40"></span> <span>2026</span>
                </div>
            </div>

            <!-- Timeline (Bottom Center) -->
            <div class="glass-secondary rounded-full p-1.5 flex overflow-x-auto no-scrollbar w-full lg:w-auto shrink-0 snap-x snap-mandatory mask-edges md:mx-auto">
                <div id="timeline-container" class="flex items-center gap-1 min-w-max px-2"></div>
            </div>

            <!-- Radio Controller (Bottom Right) -->
            <div class="glass-primary p-4 md:p-5 rounded-[20px] md:rounded-[24px] w-full lg:w-80 flex flex-col gap-4 shrink-0 group">
                <div class="flex justify-between items-center px-1">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-red-500/80 shadow-[0_0_8px_rgba(239,68,68,0.6)]" id="on-air-indicator"></div>
                        <span class="text-[9px] tracking-[0.2em] uppercase font-medium text-white/70" id="radio-mode">Puja Radio</span>
                    </div>
                    <div class="flex items-end gap-[3px] h-3 opacity-0 transition-opacity duration-500" id="audio-eq">
                        <div class="w-[2px] bg-white/80 rounded-t h-[30%] eq-bar eq-1"></div>
                        <div class="w-[2px] bg-white/80 rounded-t h-[70%] eq-bar eq-2"></div>
                        <div class="w-[2px] bg-white/80 rounded-t h-[50%] eq-bar eq-3"></div>
                        <div class="w-[2px] bg-white/80 rounded-t h-[90%] eq-bar eq-4"></div>
                    </div>
                </div>
                
                <div class="flex flex-col px-1">
                    <span id="player-track" class="font-serif text-sm md:text-base text-white/95 truncate tracking-wide">Awaiting Dawn...</span>
                </div>

                <div class="flex items-center gap-4 px-1">
                    <button id="btn-play-pause" class="w-10 h-10 rounded-full glass-micro flex items-center justify-center hover:bg-white/10 transition-colors shrink-0 outline-none">
                        <i class="fas fa-play text-xs text-white translate-x-[1px]" id="play-icon"></i>
                    </button>
                    
                    <div class="flex-1 flex flex-col justify-center cursor-pointer py-2 group/prog" id="progress-container">
                        <div class="h-[3px] w-full bg-white/10 rounded-full overflow-hidden relative">
                            <div id="progress-bar" class="absolute top-0 left-0 h-full bg-white/80 rounded-full w-0 shadow-[0_0_5px_rgba(255,255,255,0.5)]"></div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 group/vol relative cursor-pointer hidden sm:flex">
                        <i class="fas fa-volume-up text-[10px] text-white/50 hover:text-white/90 transition-colors"></i>
                        <div class="w-0 overflow-hidden group-hover/vol:w-16 transition-all duration-300 ease-out flex items-center">
                            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full h-[3px] bg-white/10 rounded-full appearance-none">
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
    
    <audio id="audio-player"></audio>
    <script src="script.js"></script>
</body>
</html>
